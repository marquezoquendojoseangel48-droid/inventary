<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>STOCKIA — Logo</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" > <style> :root { --background: #0a0d12; --surface: #11161f; --primary: #3d7cff; --primary-light: #78a7ff; --primary-dark: #1e4ca8; --white: #f5f7fa; --muted: #8993a3; --border: rgba(255, 255, 255, 0.07); } * { margin: 0; padding: 0; box-sizing: border-box; } body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: radial-gradient( circle at 50% 35%, #182338 0%, #0a0d12 58% ); font-family: "Manrope", sans-serif; color: var(--white); } .brand { display: flex; flex-direction: column; align-items: center; } /* ===================================================== ICONO PRINCIPAL ===================================================== */ .logo-container { width: 320px; height: 320px; display: flex; align-items: center; justify-content: center; position: relative; border-radius: 76px; background: linear-gradient( 145deg, #151c27, #0d1118 ); border: 1px solid var(--border); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.04); overflow: hidden; } /* Luz ambiental del núcleo */ .logo-container::before { content: ""; position: absolute; width: 210px; height: 210px; border-radius: 50%; background: var(--primary); opacity: 0.08; filter: blur(60px); } /* ===================================================== SVG ===================================================== */ .logo { width: 235px; height: 235px; position: relative; z-index: 2; } /* ===================================================== WORDMARK ===================================================== */ .brand-name { margin-top: 30px; font-size: 42px; font-weight: 800; letter-spacing: -2.5px; color: var(--white); } .brand-name span { color: var(--primary); } .brand-description { margin-top: 6px; font-size: 10px; font-weight: 600; letter-spacing: 2.6px; text-transform: uppercase; color: var(--muted); } /* ===================================================== PREVIEW DE ICONOS PEQUEÑOS ===================================================== */ .sizes { margin-top: 55px; display: flex; align-items: end; justify-content: center; gap: 20px; padding-top: 28px; border-top: 1px solid var(--border); } .size-preview { display: flex; flex-direction: column; align-items: center; gap: 10px; } .size-preview span { color: var(--muted); font-size: 10px; font-weight: 600; } .mini { display: flex; align-items: center; justify-content: center; border-radius: 22%; background: var(--surface); border: 1px solid var(--border); } .mini svg { width: 76%; height: 76%; } .size-128 { width: 128px; height: 128px; } .size-64 { width: 64px; height: 64px; } .size-32 { width: 32px; height: 32px; } @media (max-width: 500px) { .logo-container { width: 270px; height: 270px; border-radius: 64px; } .logo { width: 200px; height: 200px; } .brand-name { font-size: 36px; } .sizes { gap: 12px; } .size-128 { width: 105px; height: 105px; } } </style> </head> <body> <main class="brand"> <!-- ================================================= ICONO ================================================== --> <div class="logo-container"> <svg class="logo" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" > <defs> <!-- Gradiente principal --> <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%" > <stop offset="0%" stop-color="#78a7ff" /> <stop offset="55%" stop-color="#3d7cff" /> <stop offset="100%" stop-color="#1e4ca8" /> </linearGradient> <!-- Brillo --> <radialGradient id="coreGlow"> <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" /> <stop offset="35%" stop-color="#78a7ff" stop-opacity="0.35" /> <stop offset="100%" stop-color="#3d7cff" stop-opacity="0" /> </radialGradient> <!-- Sombra --> <filter id="shadow" x="-100%" y="-100%" width="300%" height="300%" > <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" /> </filter> </defs> <!-- ================================================= ANILLO EXTERIOR ================================================== --> <circle cx="150" cy="150" r="112" fill="none" stroke="#3d7cff" stroke-width="4" stroke-opacity="0.18" /> <!-- ================================================= SEGMENTOS DEL NÚCLEO ================================================== --> <path d=" M150 38 A112 112 0 0 1 246 92 " fill="none" stroke="#3d7cff" stroke-width="9" stroke-linecap="round" opacity="0.9" /> <path d=" M262 150 A112 112 0 0 1 208 246 " fill="none" stroke="#78a7ff" stroke-width="9" stroke-linecap="round" opacity="0.7" /> <path d=" M150 262 A112 112 0 0 1 54 208 " fill="none" stroke="#3d7cff" stroke-width="9" stroke-linecap="round" opacity="0.55" /> <path d=" M38 150 A112 112 0 0 1 92 54 " fill="none" stroke="#78a7ff" stroke-width="9" stroke-linecap="round" opacity="0.75" /> <!-- ================================================= CONEXIONES HACIA EL CENTRO ================================================== --> <line x1="104" y1="104" x2="128" y2="128" stroke="#3d7cff" stroke-width="7" stroke-linecap="round" /> <line x1="196" y1="104" x2="172" y2="128" stroke="#3d7cff" stroke-width="7" stroke-linecap="round" /> <line x1="196" y1="196" x2="172" y2="172" stroke="#3d7cff" stroke-width="7" stroke-linecap="round" /> <line x1="104" y1="196" x2="128" y2="172" stroke="#3d7cff" stroke-width="7" stroke-linecap="round" /> <!-- ================================================= NÚCLEO ================================================== --> <circle cx="150" cy="150" r="70" fill="#3d7cff" opacity="0.10" /> <circle cx="150" cy="150" r="53" fill="url(#coreGradient)" filter="url(#shadow)" /> <!-- Brillo interno --> <circle cx="150" cy="150" r="53" fill="url(#coreGlow)" /> <!-- Núcleo interior --> <circle cx="150" cy="150" r="18" fill="#ffffff" opacity="0.96" /> <!-- ================================================= NODOS EXTERNOS ================================================== --> <circle cx="150" cy="38" r="7" fill="#78a7ff" /> <circle cx="262" cy="150" r="7" fill="#3d7cff" /> <circle cx="150" cy="262" r="7" fill="#78a7ff" /> <circle cx="38" cy="150" r="7" fill="#3d7cff" /> </svg> </div> <!-- ================================================= NOMBRE ================================================== --> <div class="brand-name"> STOCK<span>IA</span> </div> <div class="brand-description"> Business Management </div> <!-- ================================================= PRUEBA DE ESCALABILIDAD ================================================== --> <section class="sizes"> <!-- 128 --> <div class="size-preview"> <div class="mini size-128"> <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" > <circle cx="150" cy="150" r="112" fill="none" stroke="#3d7cff" stroke-width="8" opacity=".2" /> <circle cx="150" cy="150" r="58" fill="#3d7cff" /> <circle cx="150" cy="150" r="18" fill="#ffffff" /> <circle cx="150" cy="38" r="8" fill="#78a7ff"/> <circle cx="262" cy="150" r="8" fill="#3d7cff"/> <circle cx="150" cy="262" r="8" fill="#78a7ff"/> <circle cx="38" cy="150" r="8" fill="#3d7cff"/> </svg> </div> <span>128 px</span> </div> <!-- 64 --> <div class="size-preview"> <div class="mini size-64"> <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" > <circle cx="150" cy="150" r="100" fill="none" stroke="#3d7cff" stroke-width="14" /> <circle cx="150" cy="150" r="55" fill="#3d7cff" /> <circle cx="150" cy="150" r="15" fill="#ffffff" /> </svg> </div> <span>64 px</span> </div> <!-- 32 --> <div class="size-preview"> <div class="mini size-32"> <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" > <circle cx="150" cy="150" r="105" fill="#3d7cff" /> <circle cx="150" cy="150" r="45" fill="#ffffff" /> </svg> </div> <span>32 px</span> </div> </section> </main> </body> </html>
